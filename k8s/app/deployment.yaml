apiVersion: apps/v1
kind: Deployment

metadata:
  name: web-app
  namespace: devops

spec:

  selector:
    matchLabels:
      app: web-app

  template:
    metadata:
      labels:
        app: web-app

    spec:
      nodeSelector:
        workload: frontend
        
      containers:
        - name: nginx
          image: web-app:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 80

          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

          envFrom:
            - configMapRef:
                name: web-app-config

            - secretRef:
                name: web-app-secret

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "256Mi"

      volumes:
        - name: nginx-config
          configMap:
            name: web-app-nginx-config
