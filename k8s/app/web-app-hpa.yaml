apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: web-app
  namespace: devops
  labels:
    app: web-app

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web-app

  minReplicas: 2
  maxReplicas: 6

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max

      policies:
        - type: Percent
          value: 100
          periodSeconds: 60

        - type: Pods
          value: 2
          periodSeconds: 60

    scaleDown:
      stabilizationWindowSeconds: 60
      selectPolicy: Max

      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
