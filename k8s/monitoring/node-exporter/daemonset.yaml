apiVersion: apps/v1
kind: DaemonSet

metadata:
  name: node-exporter
  namespace: monitoring
  labels:
    app: node-exporter

spec:
  selector:
    matchLabels:
      app: node-exporter

  template:
    metadata:
      labels:
        app: node-exporter

    spec:
      hostNetwork: true
      hostPID: true

      dnsPolicy: ClusterFirstWithHostNet

      nodeSelector:
        kubernetes.io/os: linux

      tolerations:
        - operator: Exists
          effect: NoSchedule

        - operator: Exists
          effect: NoExecute

      containers:
        - name: node-exporter
          image: quay.io/prometheus/node-exporter:v1.11.1
          imagePullPolicy: IfNotPresent

          args:
            - --path.procfs=/host/proc
            - --path.sysfs=/host/sys
            - --path.rootfs=/host/root
            - --web.listen-address=:9100
            - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)

          ports:
            - name: metrics
              containerPort: 9100
              protocol: TCP

          readinessProbe:
            httpGet:
              path: /
              port: metrics

            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: metrics

            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 25m
              memory: 32Mi

            limits:
              cpu: 100m
              memory: 128Mi

          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true

            - name: sys
              mountPath: /host/sys
              readOnly: true

            - name: root
              mountPath: /host/root
              readOnly: true
              mountPropagation: HostToContainer

      volumes:
        - name: proc
          hostPath:
            path: /proc
            type: Directory

        - name: sys
          hostPath:
            path: /sys
            type: Directory

        - name: root
          hostPath:
            path: /
            type: Directory
