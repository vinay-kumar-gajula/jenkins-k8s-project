apiVersion: v1
kind: ConfigMap

metadata:
  name: grafana-datasources
  namespace: monitoring
  labels:
    app: grafana

data:
  prometheus.yaml: |
    apiVersion: 1

    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false

        jsonData:
          timeInterval: 15s
