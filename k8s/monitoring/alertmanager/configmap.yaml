apiVersion: v1
kind: ConfigMap

metadata:
  name: alertmanager-config
  namespace: monitoring
  labels:
    app: alertmanager

data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      receiver: local-receiver

      group_by:
        - alertname
        - namespace
        - severity

      group_wait: 10s
      group_interval: 1m
      repeat_interval: 4h

    receivers:
      - name: local-receiver
