apiVersion: apps/v1
kind: Deployment

metadata:
  name: mailhog
  namespace: monitoring
  labels:
    app: mailhog

spec:
  replicas: 1

  selector:
    matchLabels:
      app: mailhog

  template:
    metadata:
      labels:
        app: mailhog

    spec:
      nodeSelector:
        kubernetes.io/os: linux

      containers:
        - name: mailhog
          image: mailhog/mailhog:v1.0.1
          imagePullPolicy: IfNotPresent

          ports:
            - name: smtp
              containerPort: 1025

            - name: web
              containerPort: 8025

          readinessProbe:
            httpGet:
              path: /
              port: web
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: web
            initialDelaySeconds: 15
            periodSeconds: 20

          resources:
            requests:
              cpu: 25m
              memory: 32Mi

            limits:
              cpu: 100m
              memory: 128Mi
